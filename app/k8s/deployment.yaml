apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-backend
  namespace: default
  labels:
    app: chatapp
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatapp
  template:
    metadata:
      labels:
        app: chatapp
    spec:
      
      # CASE 1 — Container runs as root user
      # Checkov check: CKV_K8S_6  "Do not admit root containers"
      # VULN: runAsNonRoot not set, effective UID is 0 (root)

      
      # CASE 2 — hostNetwork enabled
      # Checkov check: CKV_K8S_19 "Do not admit Pods that use the host network"
      
      hostNetwork: true    # VULN: pod shares host network namespace — can sniff host traffic
      hostPID: true        # VULN: pod shares host PID namespace — can inspect all processes
      hostIPC: true        # VULN: pod shares host IPC namespace — inter-process attacks possible

      containers:
        - name: chatapp-backend
          image: chatapp/backend:latest   # VULN (also Container Scan): unversioned 'latest' tag
          ports:
            - containerPort: 3000

          
          # CASE 3 — Privileged container
          # Checkov check: CKV_K8S_16 "Do not admit containers with the securityContext.privileged"
          securityContext:
            privileged: true             # VULN: full host system access — container escape possible
            runAsUser: 0                 # VULN: explicitly running as root (uid=0)
            runAsNonRoot: false          # VULN: explicitly allowing root
            allowPrivilegeEscalation: true  # VULN: processes can gain higher privileges
            capabilities:
              add:
                - NET_ADMIN              # VULN: network admin capabilities — enables packet sniffing
                - SYS_ADMIN             # VULN: most dangerous capability — near-root access

          
          # CASE 4 — No resource limits
          # Checkov check:
          #   CKV_K8S_11 "CPU limits should be set"
          #   CKV_K8S_13 "Memory limits should be set"   

          # VULN: No resources block — enables DoS via resource exhaustion

          env:
            
            # CASE 5 — Secrets in environment variables (not K8s Secrets)
            # Checkov check: CKV_K8S_35 "Prefer using secrets over environment variables"
            
            - name: MONGO_URI
              value: "mongodb+srv://admin:password123@cluster0.mongodb.net/chatapp"  # VULN: credential in manifest
            - name: JWT_SECRET
              value: "myjwtsecret"          # VULN: secret in plaintext env var
            - name: NODE_ENV
              value: "production"

          
          # CASE 6 — Liveness probe missing (availability risk)
          
          # Checkov check: CKV_K8S_8 "Liveness Probe should be configured"
          # VULN: No liveness/readiness probes — unhealthy pods won't be restarted

          volumeMounts:
            - name: host-root
              mountPath: /host   # VULN: mounting host root filesystem into container

      volumes:
        
        # CASE 7 — Host path volume (filesystem access)
        # Checkov check: CKV_K8S_28 "Do not admit Pods with the hostPath"        
        - name: host-root
          hostPath:
            path: /               # VULN: mounts the entire host filesystem read-write
            type: Directory

      # VULN: No pod security context restricting syscalls
      # Missing: seccompProfile, AppArmor annotations
