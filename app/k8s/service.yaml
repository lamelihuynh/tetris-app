apiVersion: v1
kind: Service
metadata:
  name: chatapp-backend-service
  namespace: default
  labels:
    app: chatapp
spec:
  selector:
    app: chatapp

  # CASE 1 — NodePort exposure of internal service
  # Checkov check: CKV_K8S_26 "Do not specify NodePort directly"

  # NodePort binds the service on ALL nodes of the cluster on the
  # specified port. This makes the backend directly reachable from
  # outside the cluster, bypassing any API gateway or ingress.
  type: NodePort    # VULN: should be ClusterIP for internal services

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000    # VULN: hardcoded NodePort exposes backend on all cluster nodes

---

# CASE 2 — MongoDB exposed as NodePort (database direct access)

# Checkov check: CKV_K8S_26
# Exposing a database port via NodePort allows attackers to connect
# directly to the database from outside, bypassing the application layer.

apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: default
spec:
  selector:
    app: mongodb
  type: NodePort           # VULN: database should never be NodePort
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
      nodePort: 32017      # VULN: MongoDB directly accessible from outside the cluster

---

# CASE 3 — LoadBalancer without any network policy

# Missing NetworkPolicy resource means all pods can communicate
# freely with each other — no network segmentation.
# No NetworkPolicy defined below means:
#   - Frontend pod can reach MongoDB directly
#   - Compromised pod can reach all other pods
#   - No east-west traffic restriction

apiVersion: v1
kind: Service
metadata:
  name: chatapp-frontend-service
  namespace: default
spec:
  selector:
    app: chatapp-frontend
  type: LoadBalancer     # Appropriate for frontend, but missing NetworkPolicy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
